project:
  type: website
  output-dir: docs

website:
  title: "Aaron R. King"
  site-url: "https://aaronrking.com"
  description: "Geographer studying community-based conservation, participatory governance, and institutional change in Southern Africa."
  favicon: assets/img/headshot.jpg
  navbar:
    title: "Aaron R. King"
    pinned: true
    right:
      - text: "Research"
        href: research.qmd
      - text: "Dissertation"
        href: dissertation.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Practice"
        href: practice.qmd
      - text: "CV"
        href: cv.qmd
      - text: "Contact"
        href: contact.qmd
  page-footer:
    left: "© Aaron R. King"
    center: "Built with Quarto"
    right:
      - text: "ORCID"
        href: "https://orcid.org/0000-0003-0261-3268"
      - text: "Google Scholar"
        href: "https://scholar.google.com/citations?user=DPA0MYgAAAAJ&hl=en"
      - text: "GitHub"
        href: "https://github.com/aaronrking"
  search:
    location: navbar
    type: overlay

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: true
    grid:
      sidebar-width: 250px
      body-width: 850px
      margin-width: 250px
execute:
  freeze: auto
